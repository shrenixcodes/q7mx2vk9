services:
  - type: web
    name: windlens-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set manually to the deployed Vercel origin, e.g. https://windlens.vercel.app
